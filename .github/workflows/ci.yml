name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      languagetool:
        # Pinned by digest for reproducibility (erikvl87/languagetool:latest at pin time).
        image: erikvl87/languagetool@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
        ports:
          - 8081:8010
        env:
          Java_Xmx: 1g
        # The runner waits for this healthcheck before starting steps, so no
        # manual wait-loop is needed. curl is present in the image (Alpine), and
        # the check hits the in-container port 8010.
        options: >-
          --health-cmd "curl -fsS http://localhost:8010/v2/languages || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          PROSE_LINT_SERVER: http://localhost:8081
        run: python -m pytest -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: ruff
        run: ruff check bin/ tests/
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Guard the glob so an empty bin/ (no .sh files) does not fail the job
          # on an unexpanded literal path.
          if ls bin/*.sh >/dev/null 2>&1; then
            shellcheck bin/*.sh
          else
            echo "No shell scripts in bin/, skipping shellcheck"
          fi
