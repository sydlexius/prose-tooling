# Auto-approve and enable auto-merge on Dependabot PRs for patch and minor
# updates. Major version bumps are left for manual review.
#
# Merging is handled by GitHub's native auto-merge: the PR merges by itself
# once the branch ruleset's required status checks pass. There is deliberately
# no polling workflow -- a previous dependabot-merge.yml re-implemented this
# in bash and misread a permissions error from `gh pr checks --watch` as a
# failing check, silently blocking every merge.
#
# Prerequisites:
#   - Branch ruleset on main requiring status checks
#   - "Allow auto-merge" enabled (Settings > General > Pull Requests)
#   - "Allow GitHub Actions to create and approve pull requests" enabled
#     (Settings > Actions > General > Workflow permissions)

name: Auto-approve Dependabot PRs

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    concurrency:
      group: dependabot-auto-approve-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve patch and minor updates
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'),
          steps.metadata.outputs.update-type)
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'),
          steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
